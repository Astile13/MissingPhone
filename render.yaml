# Review plans in Render before applying. Free database expires after 30 days.
services:
  - type: web
    name: wanderlock
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: wanderlock-db
          property: connectionString
databases:
  - name: wanderlock-db
    databaseName: wanderlock
    user: wanderlock
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
